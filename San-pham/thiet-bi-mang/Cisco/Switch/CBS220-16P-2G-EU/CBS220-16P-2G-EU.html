 (MAC) addresses"],["Spanning Tree Protocol (STP)","Standard 802.1d Spanning Tree support, enabled by default Fast convergence using 802.1w (Rapid Spanning Tree [RSTP]) Multiple Spanning Tree instances using 802.1s (MSTP) 16 instances are supported"],["Port grouping","Support for IEEE 802.3ad Link Aggregation Control Protocol (LACP) + Up to 8 groups + Up to 8 ports per group with 16 candidate ports for each (dynamic) 802.3ad link aggregation Load balance based on source and destination MAC address, or source and destination MAC/IP"],["VLAN","Support for up to 256 Virtual Local Area Networks (VLANs) simultaneously Port-based and 802.1Q tag-based VLANs Management VLAN Guest VLAN"],["Auto voice VLAN","Voice traffic is automatically assigned to a voice-specific VLAN and treated with appropriate levels of QoS"],["QinQ VLAN","VLANs transparently cross a service provider network while isolating traffic among customers"],["Generic VLAN Registration Protocol (GVRP) and Generic Attribute Registration Protocol (GARP)","Protocols for automatically propagating and configuring VLANs in a bridged domain"],["Head-of-Line (HOL) blocking","HOL blocking prevention"],["Jumbo frame","Frame sizes up to 9,216 supported"],["Loopback detection","Loopback detection provides protection against loops by transmitting loop protocol packets out of ports on which loop protection has been enabled. It operates independently of STP."],["Automatic Media-Dependent Interface Crossover (MDIX)","Automatically adjusts transmit and receive pairs if an incorrect cable type (crossover or straight-through) is installed"],["ACLs","Drop or rate limit based on source and destination MAC, VLAN ID or IP address, protocol, port, Differentiated Services Code Point (DSCP)/IP precedence, Transmission Control Protocol (TCP)/ User Datagram Protocol (UDP) source and destination ports, 802.1p priority, Ethernet type, Internet Control Message Protocol (ICMP) packets, Internet Group Management Protocol (IGMP) packets, TCP flag Support up to 512 rules"],["Port security","Creates the ability to lock source MAC addresses to ports; limits the number of learned MAC addresses"],["IEEE 802.1X (authenticator role)","802.1X: Remote Authentication Dial-in User Service (RADIUS) authentication; guest VLAN; Single-host, multiple-host, and multisession mode"],["RADIUS, TACACS+","Supports RADIUS and Terminal Access Controller Access Control System (TACACS) authentication; switch functions as a client"],["MAC address filtering","Supported"],["Storm control","Broadcast, multicast, and unknown unicast"],["DoS protection","DOS attack prevention"],["STP Bridge Protocol Data Unit (BPDU) Guard","This security mechanism protects the network from invalid configurations. A port enabled for BPDU Guard is shut down if a BPDU message is received on that port."],["Spanning Tree Loop Guard","This feature provides additional protection against Layer 2 forwarding loops (STP loops)."],["Secure Shell (SSH) Protocol","SSH is a secure replacement for Telnet traffic. SCP also uses SSH. SSH v1 and v2 are supported."],["Secure Sockets Layer (SSL)","SSL support: Encrypts all HTTPS traffic, allowing highly secure access to the browser-based management GUI in the switch"],["Priority levels","8 hardware queues per port"],["Scheduling","Strict priority and Weighted Round-Robin (WRR) queue assignment based on DSCP and class of service (802.1p/CoS)"],["Class of service","Port-based; 802.1p VLAN priority-based; IPv4/v6 IP precedence, Type of Service (ToS), and DSCP-based; Differentiated Services (DiffServ); classification and re-marking ACLs, trusted QoS"],["Rate limiting","Ingress policer; egress shaping and rate control; per VLAN, per port, and flow-based"],["Congestion avoidance","A TCP congestion avoidance algorithm is required to reduce and prevent global TCP loss synchronization"],["Internet Group Management Protocol (IGMP) Versions 1, 2, and 3 Snooping","IGMP limits bandwidth-intensive multicast traffic to only the requesters; supports 256 multicast groups"],["IGMP querier","IGMP querier is used to support a Layer 2 multicast domain of snooping switches in the absence of a multicast router"],["IPv6","IPv6 host mode IPv6 over Ethernet IPv6/IPv4 Dual Stack IPv6 neighbor and router discovery (ND) IPv6 stateless address auto-configuration Path Maximum Transmission Unit (MTU) discovery Duplicate Address Detection (DAD) ICMP version 6"],["IPv6 ACL","Drop or rate limit IPv6 packets in hardware"],["IPv6 QoS","Prioritize IPv6 packets in hardware"],["Multicast Listener Discovery (MLD v1/2) Snooping","Deliver IPv6 multicast packets only to the required receivers"],["IPv6 applications","Web/SSL, Telnet server/SSH, DHCP Client, DHCP Autoconfig, Cisco Discovery Protocol (CDP), Link Layer Discovery Protocol (LLDP)"],["IPv6 Requests for Comments (RFCs) supported","RFC 4443 (which obsoletes RFC2463) - ICMP version 6 RFC 4291 (which obsoletes RFC 3513) - IPv6 address architecture RFC 4291 - IPv6 addressing architecture RFC 2460 - IPv6 specification RFC 4861 (which obsoletes RFC 2461) - Neighbor discovery for IPv6 RFC 4862 (which obsoletes RFC 2462) - IPv6 stateless address auto-configuration RFC 1981 - Path MTU discovery RFC 4007 - IPv6 scoped address architecture RFC 3484 - Default address selection mechanism"],["Cisco Business Dashboard","Support direct management with Cisco Business Dashboard and mobile app. Eliminates the need to set up a separate hardware or virtual machine for the Cisco Business Dashboard Probe on site."],["Cisco Business mobile app","Mobile app for Cisco Business Switch and Wireless products. Helps to set up a local network in minutes and provide easy management at your fingertips."],["Cisco Network Plug and Play (PnP) agent","The Cisco Network Plug and Play solution provides a simple, secure, unified, and integrated offering to ease new branch or campus device rollouts or for provisioning updates to an existing network. The solution provides a unified approach to provision Cisco routers, switches, and wireless devices with a zero touch deployment experience. Supports Cisco PnP Connect"],["Web user interface","Built-in switch configuration utility for easy browser-based device configuration (HTTP/HTTPS). Supports configuration, system dashboard, system maintenance, and monitoring"],["Text-editable config files","Config files can be edited with a text editor and downloaded to another switch, facilitating easier mass deployment"],["Command-line interface","Scriptable CLI; a full CLI is supported. User privilege levels 1 and 15 are supported for the CLI"],["SNMP","Simple Management Network Protocol (SNMP) versions 1, 2c, and 3 with support for traps, and SNMP version 3 User-based Security Model (USM)"],["Remote Monitoring (RMON)","Embedded RMON software agent supports 4 RMON groups (history, statistics, alarms, and events) for enhanced traffic management, monitoring, and analysis"],["IPv4 and IPv6 dual stack","Coexistence of both protocol stacks to ease migration"],["Port mirroring","Traffic on a port or VLAN can be mirrored to another port for analysis with a network analyzer or RMON probe. Up to 8 source ports can be mirrored to one destination port. Four sessions are supported"],["Firmware upgrade","Web browser upgrade (HTTP/HTTPS) and Trivial File Transfer Protocol (TFTP) Dual images for resilient firmware upgrades"],["DHCP (Option 12, 66, 67, 82, 129, and 150)","DHCP options facilitate tighter control from a central point (DHCP server) to obtain IP address, auto-configuration (with configuration file download), DHCP relay, and hostname"],["Time synchronization","Simple Network Time Protocol (SNTP)"],["Login banner","Configurable multiple banners for web as well as CLI"],["Other management","HTTP/HTTPS; TFTP upgrade; DHCP client; Bootstrap Protocol (BOOTP); cable diagnostics; ping; traceroute; syslog"],["Bonjour","The switch advertises itself using the Bonjour protocol"],["Link Layer Discovery Protocol (LLDP) (802.1ab) with LLDP-MED Extensions","LLDP allows the switch to advertise its identification, configuration, and capabilities to neighboring devices that store the data in a MIB. LLDP-MED is an enhancement to LLDP that adds the extensions needed for IP phones"],["Cisco Discovery Protocol","The switch advertises itself using the Cisco Discovery Protocol. Displays brief information for connected Cisco network devices, IP phones, and wireless access points"],["EEE compliance (802.3az)","Support 802.3az Energy Efficient Ethernet on all ports; substantially reduce the power consumption when link bandwidth is not at full utilization"],["Energy Detect","Automatically turns power off on Gigabit Ethernet and 10/100 RJ-45 ports when detecting a link down Active mode is resumed without loss of any packets when the switch detects the link up"],["Disable port LEDs","LEDs can be manually turned off to save on energy."],["Time-based PoE","PoE power can be on or off based on user-defined schedule to save energy"],["Time-based port operation","Link up or down based on user-defined schedule (when the port is administratively up)"],["PoE Power Budget","130W"],["Number of Ports That Support PoE","16"],["Pre-standard PoE","Support Cisco Pre-Standard PoE"],["Intelligent PoE power management","Support the granular power negotiation with CDP/LLDP communication with PD devices after IEEE classification"],["Buttons","Reset button"],["Cabling type","Unshielded Twisted Pair (UTP) Category 5 or better for 10BASE-T/100BASE-TX; UTP Category 5 Ethernet or better for 1000BASE-T"],["LEDs","System, Link/Act, Speed"],["Flash","64 MB"],["CPU memory","256 MB"],["Ports","Total system ports: 18 Gigabit Ethernet"],["Packet buffer","4.1 Mb"],["Unit dimensions (W x D x H)","440 x 203 x 44 mm"],["Unit weight","3.03 kg"],["Power","100-240 V, 50-60 Hz"],["Certifications","UL (UL 60950), CSA (CSA 22.2), CE mark, FCC Part 15 (CFR 47) Class A, C-tick"],["Operating temperature","0-50° C"],["Storage temperature","20° C to +70° C"],["Operating humidity","10% to 90%, relative, noncondensing"],["Storage humidity","10% to 90%, relative, noncondensing"],["Power Consumption","System power consumption: 110V=16.8W 220V=18.3W"],["Acoustic Noise and Mean Time Between Failure (MTBF)","Fan (number): Fanless"]],"specificationsSource":"https://www.sieuthivienthong.com/16-port-ge-poe-smart-switch-cisco-cbs220-16p-2g-eu-62996.html","specificationsChecked":"2026-07-20","referenceSources":["https://www.sieuthivienthong.com/16-port-ge-poe-smart-switch-cisco-cbs220-16p-2g-eu-62996.html"],"vuhoangChecked":"2026-07-20","crossReferenceStatus":"vuhoang-model-not-found","thumbnail":"/img/thumbnails/eb75121cb3aa26677617.webp"}}</script></body></html>
